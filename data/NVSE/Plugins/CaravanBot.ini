; CaravanBot settings. At a Caravan table, press the toggle key to turn the bot on or off.
[Bot]
; DirectInput key code: 0x42 = F8, 0x43 = F9, 0x44 = F10, 0x57 = F11
ToggleKey=0x42
; 1 = also write the table to <game folder>\CaravanBot\state.json and play moves from move.json,
; so an outside program can play (see the GitHub page). Leave at 0 to just use the bot.
ExternalControl=0
